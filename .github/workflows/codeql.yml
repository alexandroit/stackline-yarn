name: CodeQL

on:
  push:
    branches: [stackline]
  pull_request:
    branches: [stackline]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          db-location: ${{ runner.temp }}/stackline-yarn-codeql
          config: |
            paths:
              - src
              - bin
              - lib
              - scripts
              - test
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      - name: Confirm rebuilt executable was extracted by CodeQL
        env:
          CODEQL_DATABASE: ${{ runner.temp }}/stackline-yarn-codeql
        run: python3 scripts/check-codeql-coverage.py
